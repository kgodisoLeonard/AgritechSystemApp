server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API proxy so the app also works through a tunnel / any hostname.
    # Variables + resolver keep nginx from failing at startup if a service is down.
    resolver 127.0.0.11 valid=10s;

    location /node/ {
        set $node_api http://api:3000;
        rewrite ^/node/(.*)$ /$1 break;
        proxy_pass $node_api;
    }

    location /fin/ {
        set $fin_api http://agrifinance-api:8080;
        rewrite ^/fin/(.*)$ /$1 break;
        proxy_pass $fin_api;
        proxy_connect_timeout 10s;
        proxy_read_timeout 240s;
    }

    # Single-page app: fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
