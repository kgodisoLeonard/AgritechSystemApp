name: Publish container images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DB_IMAGE: ghcr.io/kgodisoleonard/agritech-db
  API_IMAGE: ghcr.io/kgodisoleonard/agritech-api

jobs:
  publish-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push database image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DB_IMAGE }}:latest
            ${{ env.DB_IMAGE }}:${{ github.sha }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}

  vps-secrets:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

    steps:
      - name: Check VPS deployment secrets
        id: check
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ] && [ -n "$POSTGRES_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Skipping VPS deploy. Configure VPS_HOST, VPS_USER, VPS_SSH_KEY, and POSTGRES_PASSWORD repository secrets."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    runs-on: ubuntu-latest
    needs:
      - publish-images
      - vps-secrets
    if: needs.vps-secrets.outputs.configured == 'true'
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Sync repository to VPS
        run: |
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "
            set -e
            if [ -d ~/agritech-db/.git ]; then
              cd ~/agritech-db && git fetch origin main && git reset --hard origin/main
            else
              rm -rf ~/agritech-db
              git clone --branch main https://github.com/${{ github.repository }}.git ~/agritech-db
            fi
          "

      - name: Deploy containers on VPS
        run: |
          set +e
          out=$(printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "
            cd ~/agritech-db
            printf 'POSTGRES_PASSWORD=%s\nNODE_ENV=production\n' '$POSTGRES_PASSWORD' > .env
            chmod 600 .env
            docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            docker compose pull
            docker rm -f agritech_db agritech_api agritech_ai_service 2>/dev/null || true
            docker compose up -d --no-build --remove-orphans
            echo --- container state ---
            docker compose ps
            docker ps -a --filter name=agritech_
            echo --- database image ---
            docker image inspect ghcr.io/kgodisoleonard/agritech-db:latest --format 'DB image config digest: {{.Id}}'
            echo --- waiting up to 60s for database ---
            for i in $(seq 1 20); do
              if docker exec agritech_db pg_isready -U agritech_user -d agritech; then
                echo DATABASE_READY
                break
              fi
              echo waiting-for-database
              sleep 3
            done
            echo --- database container logs ---
            docker logs --tail 80 agritech_db || true
            echo --- schema check ---
            docker exec agritech_db psql -U agritech_user -d agritech -c 'SELECT count(*) AS farmers FROM farmers;' || echo SCHEMA_CHECK_FAILED
          " 2>&1)
          rc=$?
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -q SCHEMA_CHECK_FAILED; then
            echo "::warning::Schema check failed on the VPS database - the farmers table may be missing. See the schema check section above."
          fi
          if printf '%s' "$out" | grep -q DATABASE_READY; then
            echo "VPS deployment verified: agritech_db is accepting connections."
            exit $rc
          fi
          echo "::error::agritech_db on the VPS is NOT accepting connections after 60s. See the database container logs section above."
          exit 1
