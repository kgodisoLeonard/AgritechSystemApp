name: Publish container images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DB_IMAGE: ghcr.io/kgodisoleonard/agritech-db
  API_IMAGE: ghcr.io/kgodisoleonard/agritech-api

jobs:
  publish-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The VPS is an Oracle Cloud A1 Arm instance (arm64). Building on
      # ubuntu-latest alone produces amd64 images, which crash on the VPS with
      # "exec /usr/local/bin/docker-entrypoint.sh: exec format error". These two
      # steps enable cross-platform builds so both architectures are published.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push database image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DB_IMAGE }}:latest
            ${{ env.DB_IMAGE }}:${{ github.sha }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}

  vps-secrets:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

    steps:
      - name: Check VPS deployment secrets
        id: check
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ] && [ -n "$POSTGRES_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Skipping VPS deploy. Configure VPS_HOST, VPS_USER, VPS_SSH_KEY, and POSTGRES_PASSWORD repository secrets."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    runs-on: ubuntu-latest
    needs:
      - publish-images
      - vps-secrets
    if: needs.vps-secrets.outputs.configured == 'true'
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Sync repository to VPS
        run: |
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "
            set -e
            if [ -d ~/agritech-db/.git ]; then
              cd ~/agritech-db && git fetch origin main && git reset --hard origin/main
            else
              rm -rf ~/agritech-db
              git clone --branch main https://github.com/${{ github.repository }}.git ~/agritech-db
            fi
          "

      - name: Deploy containers on VPS
        run: |
          set +e
          out=$(printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "
            cd ~/agritech-db
            printf 'POSTGRES_PASSWORD=%s\nNODE_ENV=production\n' '$POSTGRES_PASSWORD' > .env
            chmod 600 .env
            docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            docker compose pull
            echo --- vps architecture ---
            uname -m
            docker version --format 'docker server arch: {{.Server.Arch}}' 2>/dev/null || echo docker-arch-unknown
            docker image inspect ghcr.io/kgodisoleonard/agritech-db:latest --format 'pulled db image arch: {{.Architecture}}' 2>/dev/null || echo db-image-arch-unknown
            echo --- host resources ---
            df -h /
            free -m
            docker system df
            echo --- deploy ---
            docker compose up -d --no-build --remove-orphans
            docker rm -f agritech_ai_service 2>/dev/null || true
            echo --- container state ---
            docker compose ps
            docker ps -a --filter name=agritech_
            echo --- container detail ---
            docker inspect agritech_db --format 'db state={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restarts={{.RestartCount}}' || echo NO_DB_CONTAINER
            docker inspect agritech_api --format 'api state={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restarts={{.RestartCount}}' || echo NO_API_CONTAINER
            echo --- database image ---
            docker image inspect ghcr.io/kgodisoleonard/agritech-db:latest --format 'DB image config digest: {{.Id}}' || echo NO_DB_IMAGE
            echo --- waiting up to 90s for database ---
            for i in \$(seq 1 30); do
              if docker exec agritech_db pg_isready -U agritech_user -d agritech; then
                echo DATABASE_READY
                break
              fi
              echo waiting-for-database
              sleep 3
            done
            echo --- database container logs ---
            docker logs --tail 60 agritech_db 2>&1 || echo NO_DB_LOGS
            echo --- database compose logs ---
            docker compose logs --tail 40 db 2>&1 || echo NO_COMPOSE_LOGS
            echo --- schema check ---
            docker exec agritech_db psql -U agritech_user -d agritech -c 'SELECT count(*) AS farmers FROM farmers;' || echo SCHEMA_CHECK_FAILED
          " 2>&1)
          rc=$?
          printf '%s\n' "$out"
          host=$(printf '%s' "$out" | sed -n '/--- host resources ---/,/--- deploy ---/p' | tr -s '\n' ' ' | tr -d '%' | cut -c1-700)
          detail=$(printf '%s' "$out" | sed -n '/--- container state ---/,/--- schema check ---/p' | tr -s '\n' ' ' | tr -d '%' | cut -c1-1200)
          if printf '%s' "$out" | grep -q SCHEMA_CHECK_FAILED; then
            echo "::warning::Schema check failed on the VPS database - the farmers table may be missing."
          fi
          if printf '%s' "$out" | grep -q DATABASE_READY; then
            echo "VPS deployment verified: agritech_db is accepting connections."
            exit $rc
          fi
          echo "::error title=VPS host resources::$host"
          echo "::error title=agritech_db NOT accepting connections::$detail"
          exit 1
