name: Deploy to VPS

on:
  push:
    branches:
      - main
      - fix-calculate-profit
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/kgodisoleonard/agritech-db

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push database image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  vps-secrets:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

    steps:
      - name: Check VPS deployment secrets
        id: check
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ] && [ -n "$POSTGRES_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Skipping VPS deploy. Configure VPS_HOST, VPS_USER, VPS_SSH_KEY, and POSTGRES_PASSWORD repository secrets."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    runs-on: ubuntu-latest
    needs:
      - publish
      - vps-secrets
    if: needs.vps-secrets.outputs.configured == 'true'
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Copy Docker Compose file to VPS
        run: |
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "mkdir -p ~/agritech-db"
          scp -i ~/.ssh/vps_key docker-compose.yml "$VPS_USER@$VPS_HOST:~/agritech-db/docker-compose.yml"

      - name: Deploy database container on VPS
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "cd ~/agritech-db && printf 'POSTGRES_PASSWORD=%s\n' '$POSTGRES_PASSWORD' > .env && docker login ghcr.io -u '${{ github.actor }}' --password-stdin && docker compose pull db && docker compose up -d --no-build db && docker ps --filter name=agritech_db"
