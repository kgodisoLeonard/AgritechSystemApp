name: Deploy to Oracle Cloud VPS

# Defines when this workflow will run (on any push to the main branch)
on:
  push:
    branches:
      - main

jobs:
  deploy:
    # Runs the workflow on a standard GitHub-hosted Ubuntu runner
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your repository code into the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Securely connect to your VPS via SSH and execute deployment commands
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Navigate to your project folder on the server
            cd ~/AgritechSystemApp
            
            # Pull the latest code updates from GitHub
            git pull origin main
            
            # Log into the GitHub Container Registry using your token
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u AyandaDev --password-stdin
            
            # Pull the latest images from GHCR
            docker compose pull
            
            # Stop the currently running containers safely
            docker compose down
            
            # Start the multi-container stack in the background with forced recreation
            docker compose up -d --force-recreate

            # Wait for PostgreSQL to be completely ready and accepting connections
            echo "Waiting for database to be ready..."
            until docker compose exec -T db pg_isready -U agritech_user -d agritech; do
              sleep 2
            done
            echo "Database is ready and accepting connections!"