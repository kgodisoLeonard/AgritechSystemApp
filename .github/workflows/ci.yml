name: Validate schema

# Confirms schema.sql, seed.sql, and schema_validation.sql apply
# cleanly against a real Postgres instance.
#
# Runs on GitHub-hosted ubuntu-latest: it ships psql and Docker preinstalled,
# needs no maintenance, and completes in ~22s (see runs #1-#3). Commit 8d72037
# switched this to `self-hosted`, but no runner was ever provisioned, so every
# job queued indefinitely waiting for a machine that does not exist.
# Changes to this workflow also trigger a run, so the definition stays verified.
on:
  push:
    paths:
      - "schema.sql"
      - "seed.sql"
      - "schema_validation.sql"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "schema.sql"
      - "seed.sql"
      - "schema_validation.sql"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agritech
          POSTGRES_USER: agritech_user
          POSTGRES_PASSWORD: change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: change_me
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply schema.sql
        run: psql -h localhost -U agritech_user -d agritech -v ON_ERROR_STOP=1 -f schema.sql

      - name: Apply seed.sql
        run: psql -h localhost -U agritech_user -d agritech -v ON_ERROR_STOP=1 -f seed.sql

      - name: Run schema_validation.sql
        run: psql -h localhost -U agritech_user -d agritech -v ON_ERROR_STOP=1 -f schema_validation.sql
