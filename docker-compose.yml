version: "3.9"

services:
  db:
    image: postgres:16
    container_name: agritech_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agritech
      POSTGRES_USER: agritech_user
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - agritech_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/2_seed.sql

volumes:
  agritech_data:
