services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/kgodisoleonard/agritech-db:latest
    container_name: agritech_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agritech
      POSTGRES_USER: agritech_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env or CI secret)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agritech_data:/var/lib/postgresql/data

volumes:
  agritech_data:
