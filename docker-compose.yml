services:

  db:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/kgodisoleonard/agritech-db:latest
    container_name: agritech_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: agritech
      POSTGRES_USER: agritech_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env or CI secret)}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - agritech_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agritech_user -d agritech"]
      interval: 10s
      timeout: 5s
      retries: 5


  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/kgodisoleonard/agritech-api:latest
    container_name: agritech_api
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "3000:3000"

    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}

      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: agritech
      DB_USER: agritech_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env or CI secret)}
      DB_SSL: "false"

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5


  agrifinance-api:
    build:
      context: .
      dockerfile: api/agritech-finance-api/Dockerfile.local
    image: ghcr.io/kgodisoleonard/agritech-finance-ai:latest
    container_name: agrifinance_api
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully

    ports:
      - "8081:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/agritech
      SPRING_DATASOURCE_USERNAME: agritech_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SERVER_PORT: 8080
      AI_BASE_URL: http://ai-runtime:11434
      AI_MODEL: ${AI_MODEL:-qwen2.5:0.5b}

  ai-runtime:
    image: ollama/ollama:latest
    container_name: agritech_ai_runtime
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-model:
    image: ollama/ollama:latest
    container_name: agritech_ai_model_setup
    environment:
      OLLAMA_HOST: http://ai-runtime:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${AI_MODEL:-qwen2.5:0.5b}"]
    depends_on:
      ai-runtime:
        condition: service_healthy
    restart: "no"


volumes:
  agritech_data:
  ollama_data:

networks:
  default:
    name: ai-network
